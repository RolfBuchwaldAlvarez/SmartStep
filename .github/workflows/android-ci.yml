# Android CI: build, unit tests, Android Lint and ktlint on every PR and on main.
# Its job name `android-ci` is the name to set in `required_checks` in .github/factory.yml once it is active.
name: android-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same PR replaces the run still going for the old head.
# Other runs (main, manual) get a group per commit, so none is cancelled.
concurrency:
  group: android-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  android-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      # Also validates gradle-wrapper.jar against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build, unit tests, lint, ktlint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug ktlintCheck
      - name: Reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: app/build/reports/
          retention-days: 7
