# Marks this repository as a factory repository (my-ai-second-brain#173).
# The agents' pollers work here in label mode: they only do what the
# conductor's labels next:<task>:<agent> ask.
#
# implementers: who may implement a ticket; the first is the default, a ticket
#   label implementer:<name> picks another, implementer:owner means the owner.
# judges: in order of preference; a PR's judges are the first judges_per_pr
#   of them other than its author, so nobody judges their own PR.
implementers: codex, claude
judges: claude, hermes, codex
judges_per_pr: 2
max_rounds: 3
# required_checks: the check names that count as CI for a merge; a PR
#   without them stays pending. Without the key every check except the
#   conductor's own counts, and no checks at all count as green – so set it
#   to the Android CI job names before the first ticket gets factory:ready.
